name: CI

on:
  pull_request:
  push:
    branches: [master, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate content (schemas, links, images, SEO warnings)
        run: npm run validate-content
      - name: Build static site
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
