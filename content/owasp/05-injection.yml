slug: injection
rank: 5
title: Injection
tagline: Text that becomes a command.
question: When your site mistakes what a visitor types for instructions.
summary: "SQL injection, cross-site scripting (XSS) and their relatives. Different names, one mistake: text from outside gets treated as a command."
category: website
readMinutes: 4
theme: amber
