slug: insecure-design
rank: 6
title: Insecure design
tagline: Broken before the first line of code.
question: A perfect build of a flawed blueprint.
summary: Nothing is coded wrong. The plan never asked "how could someone abuse this?", so no amount of careful programming fixes it later.
category: running
readMinutes: 3
theme: rose
