slug: mishandling-of-exceptional-conditions
rank: 10
title: Mishandling of exceptional conditions
tagline: When things break, who wins?
question: What does your site do when things go wrong?
summary: "Every system hits errors: a database timeout, a missing field, a payment provider that doesn't answer. This is about whether your site fails safely, or falls open and spills."
category: website
readMinutes: 3
theme: red
