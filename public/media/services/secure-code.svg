<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img">
<style>
text{font-family:Inter, Segoe UI, system-ui, -apple-system, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace}
.bad{animation:bad 6s infinite}.good{opacity:0;animation:good 6s infinite}.badge{opacity:0;animation:good 6s infinite;animation-delay:.3s}
@keyframes bad{0%,35%{opacity:1}45%,90%{opacity:0}100%{opacity:1}}
@keyframes good{0%,40%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="560" height="400" rx="20" fill="#0a0f0d"/>
<rect x="0.5" y="0.5" width="559" height="399" rx="19.5" fill="none" stroke="rgba(255,255,255,0.14)"/>
<rect x="28" y="28" width="504" height="344" rx="14" fill="#111816" stroke="rgba(255,255,255,0.08)"/>
<circle cx="50" cy="50" r="5" fill="#4b5752"/><circle cx="66" cy="50" r="5" fill="#4b5752"/><circle cx="82" cy="50" r="5" fill="#4b5752"/>
<text x="508" y="54" text-anchor="end" class="m" font-size="11" fill="#7d8a83">invoices.ts</text>
<line x1="28" y1="72" x2="532" y2="72" stroke="rgba(255,255,255,0.08)"/><text x="52" y="110" class="m" font-size="11.5" fill="#c4b5fd">app.get("/api/invoices/:id", auth, async (req, res) =&gt; {</text><g class="bad"><rect x="40" y="128" width="480" height="24" fill="#f87171" opacity="0.12"/><text x="52" y="144" class="m" font-size="11.5" fill="#f87171">- const inv = await db.invoice.find({ id: req.params.id });</text></g><g class="good"><rect x="40" y="128" width="480" height="24" fill="#2ecc71" opacity="0.12"/><text x="52" y="144" class="m" font-size="10.4" fill="#2ecc71">+ const inv = await db.invoice.find({ id: req.params.id, owner: req.user.id });</text></g><text x="52" y="178" class="m" font-size="11.5" fill="#e6ede9">  if (!inv) return res.status(404).end();</text><text x="52" y="212" class="m" font-size="11.5" fill="#e6ede9">  res.json(inv);</text><text x="52" y="246" class="m" font-size="11.5" fill="#c4b5fd">});</text><g class="badge"><rect x="360" y="318" width="156" height="34" rx="17" fill="#a78bfa" opacity="0.16"/><text x="438" y="340" text-anchor="middle" class="m" font-size="12" font-weight="700" fill="#a78bfa">✓ ownership check</text></g>
</svg>
