<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img">
<style>
text{font-family:Inter, Segoe UI, system-ui, -apple-system, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, Consolas, Menlo, monospace}
.spin{transform-box:fill-box;transform-origin:center;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.ok0{opacity:0;animation:o 7s infinite;animation-delay:0.40s}.sp0{animation:r 1s linear infinite,h 7s infinite;animation-delay:0s,0.40s}.ok1{opacity:0;animation:o 7s infinite;animation-delay:1.00s}.sp1{animation:r 1s linear infinite,h 7s infinite;animation-delay:0s,1.00s}.ok2{opacity:0;animation:o 7s infinite;animation-delay:1.60s}.sp2{animation:r 1s linear infinite,h 7s infinite;animation-delay:0s,1.60s}.ok3{opacity:0;animation:o 7s infinite;animation-delay:2.20s}.sp3{animation:r 1s linear infinite,h 7s infinite;animation-delay:0s,2.20s}.ok4{opacity:0;animation:o 7s infinite;animation-delay:2.80s}.sp4{animation:r 1s linear infinite,h 7s infinite;animation-delay:0s,2.80s}.ok5{opacity:0;animation:o 7s infinite;animation-delay:3.40s}.sp5{animation:r 1s linear infinite,h 7s infinite;animation-delay:0s,3.40s}@keyframes o{0%{opacity:0}3%,85%{opacity:1}95%,100%{opacity:0}}@keyframes h{0%{opacity:1}3%,85%{opacity:0}95%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
